<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Occupancy – Live | SLDP 41</title>
  <meta name="description" content="Live number of people in the gym. NYU student project (SLDP 41).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- Drop the official logo file at assets/nyu-logo.svg (see assets/README.md).
           Until then the plain text "NYU" is shown. -->
      <img src="assets/nyu-logo.svg" alt="NYU" class="logo"
           onerror="this.hidden = true; document.getElementById('wordmark').hidden = false;">
      <span id="wordmark" class="wordmark" hidden>NYU</span>
      <span class="divider" aria-hidden="true"></span>
      <span class="site-title">Gym Occupancy</span>
    </div>
  </header>

  <main>
    <section class="card" aria-labelledby="eyebrow">
      <p class="eyebrow" id="eyebrow">People in the gym right now</p>

      <p class="count" id="count" aria-live="polite">–</p>

      <div class="meter" id="meter" role="progressbar" aria-label="Occupancy rate"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="meter-fill" id="meterFill"></div>
      </div>

      <p class="rate"><strong><span id="rate">–</span>%</strong> full
        <span class="muted">(capacity <span id="capacity">25</span>)</span></p>

      <p class="status" id="status" data-level="unknown">Connecting…</p>
      <p class="updated" id="updated">&nbsp;</p>
    </section>

    <section class="legend" aria-label="Legend">
      <div class="legend-item"><span class="dot low"></span> Low <span class="muted">0–10</span></div>
      <div class="legend-item"><span class="dot moderate"></span> Moderate <span class="muted">11–20</span></div>
      <div class="legend-item"><span class="dot busy"></span> Busy <span class="muted">21+</span></div>
    </section>
  </main>

  <footer>
    Student project (SLDP 41, NYU) &ndash; not an official NYU website.
    The colours match the LED on the device.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
